<div class="quiz-tools-bar not-prose">

    {{/* ── Left: Revision Index ── */}}
    <div class="quiz-tools-ri">
      <a class="quiz-tools-ri-title" href="{{ "quiz/revision-index/" | relURL }}">
        <span class="quiz-tools-ri-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6M7 17h4"/><circle cx="18" cy="17" r="2.5"/><path d="M20 19l1.5 1.5"/></svg></span>
        Revision Index
      </a>
    </div>

    {{/* ── Right: Performance Data ── */}}
    <div id="quiz-data-panel" class="quiz-tools-data">
      <div class="quiz-data-panel-inner">
        <div class="quiz-data-panel-controls">
          <span class="quiz-data-panel-label">Performance Data</span>
          <div class="quiz-data-panel-actions">
            <button class="quiz-data-btn quiz-sync-signin-btn" type="button">Sign in with Google</button>
            <button class="quiz-data-btn quiz-sync-now-btn" type="button" hidden>Sync now</button>
            <button class="quiz-data-btn quiz-sync-signout-btn" type="button" hidden>Sign out</button>
            <button class="quiz-data-btn quiz-data-export-btn" type="button">Export</button>
            <label class="quiz-data-btn quiz-data-import-label" role="button" tabindex="0">
              Import
              <input class="quiz-data-import-input" type="file" accept=".json" aria-label="Import performance data">
            </label>
          </div>
        </div>
        <span class="quiz-data-panel-status" aria-live="polite"></span>
      </div>
    </div>

</div>

<script>
(function() {
  var statusTimeout = null;

  function setStatus(el, message, type) {
    el.textContent = message;
    el.className = 'quiz-data-panel-status' + (type ? ' ' + type : '');
    clearTimeout(statusTimeout);
    statusTimeout = setTimeout(function() {
      el.textContent = '';
      el.className = 'quiz-data-panel-status';
    }, 4000);
  }

  function whenRuntimeReady(callback) {
    function run() {
      if (window.RDocsQuiz && window.RDocsQuiz.getStore) callback();
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }
  }

  whenRuntimeReady(function() {
    var panel = document.getElementById('quiz-data-panel');
    if (!panel) return;
    var store = window.RDocsQuiz.getStore();
    var statusEl = panel.querySelector('.quiz-data-panel-status');
    var signInBtn = panel.querySelector('.quiz-sync-signin-btn');
    var syncNowBtn = panel.querySelector('.quiz-sync-now-btn');
    var signOutBtn = panel.querySelector('.quiz-sync-signout-btn');

    function renderSyncStatus(status) {
      var signedIn = !!(status && status.user);
      if (signInBtn) signInBtn.hidden = signedIn || !(status && status.firebaseEnabled);
      if (syncNowBtn) syncNowBtn.hidden = !signedIn;
      if (signOutBtn) signOutBtn.hidden = !signedIn;
      if (status && status.message) {
        setStatus(statusEl, status.message, status.state === 'error' ? 'error' : (status.state === 'synced' ? 'success' : ''));
      }
    }

    if (signInBtn) {
      signInBtn.addEventListener('click', function() {
        store.signIn().catch(function(err) {
          setStatus(statusEl, err.message || 'Sign-in failed.', 'error');
        });
      });
    }

    if (syncNowBtn) {
      syncNowBtn.addEventListener('click', function() {
        store.syncNow().catch(function(err) {
          setStatus(statusEl, err.message || 'Sync failed.', 'error');
        });
      });
    }

    if (signOutBtn) {
      signOutBtn.addEventListener('click', function() {
        store.signOut().catch(function(err) {
          setStatus(statusEl, err.message || 'Sign-out failed.', 'error');
        });
      });
    }

    panel.querySelector('.quiz-data-export-btn').addEventListener('click', function() {
      try {
        var payload = store.exportData();
        var date = new Date().toISOString().slice(0, 10);
        var blob = new Blob([payload], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'quiz-performance-' + date + '.json';
        a.click();
        URL.revokeObjectURL(url);
        setStatus(statusEl, 'Exported successfully.', 'success');
      } catch (e) {
        setStatus(statusEl, 'Export failed.', 'error');
      }
    });

    panel.querySelector('.quiz-data-import-input').addEventListener('change', function(e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var result = store.importData(ev.target.result, true);
          setStatus(statusEl, 'Imported ' + result.imported + ' questions (' + result.merged + ' updated).', 'success');
        } catch (err) {
          setStatus(statusEl, err.message || 'Import failed.', 'error');
        }
        e.target.value = '';
      };
      reader.onerror = function() {
        setStatus(statusEl, 'Could not read file.', 'error');
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    window.addEventListener('rdocsquiz:syncstatus', function(e) {
      renderSyncStatus(e.detail);
    });
    renderSyncStatus(store.getStatus());
  });
})();
</script>
